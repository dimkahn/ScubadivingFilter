<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'unsafe-inline'">
<title>Moteur vidéo</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* Pas de display:none : sur iOS, une vidéo masquée cesse de fournir des images à WebGL. */
  #src{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="src" playsinline webkit-playsinline preload="auto"></video>
<script src="vendor/mp4box.all.min.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="engine.js"></script>
</body>
</html>
