    <rect width="1024" height="1024" fill="url(#water)"/>

    <!-- bulles -->
    <g fill="#BFEAF5" fill-opacity=".85">
      <circle cx="896" cy="306" r="30"/>
      <circle cx="858" cy="176" r="20"/>
      <circle cx="936" cy="126" r="12"/>
