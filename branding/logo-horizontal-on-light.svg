<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1805 400" width="1805" height="400" role="img" aria-label="Scuba See Red">
  <title>Scuba See Red</title>
  <svg x="30" y="30" width="340" height="340" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1590AE"/>
      <stop offset="0.55" stop-color="#0B5E82"/>
      <stop offset="1" stop-color="#07344F"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB4CC"/>
      <stop offset="1" stop-color="#2F86A6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A55"/>
      <stop offset="1" stop-color="#F03A26"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <path id="lens-shape" d="M280 356 Q280 330 308 330 H494 V450 Q468 460 450 492 Q430 530 398 530 H348 Q280 530 280 468 Z"/>
