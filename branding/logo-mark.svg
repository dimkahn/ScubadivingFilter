<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Scuba See Red">
  <title>Scuba See Red</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1590AE"/>
      <stop offset="0.55" stop-color="#0B5E82"/>
      <stop offset="1" stop-color="#07344F"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB4CC"/>
      <stop offset="1" stop-color="#2F86A6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A55"/>
      <stop offset="1" stop-color="#F03A26"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <path id="lens-shape" d="M280 356 Q280 330 308 330 H494 V450 Q468 460 450 492 Q430 530 398 530 H348 Q280 530 280 468 Z"/>
    <clipPath id="lens-clip"><use xlink:href="#lens-shape" href="#lens-shape"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#water)"/>

    <!-- bulles -->
    <g fill="#BFEAF5" fill-opacity=".85">
      <circle cx="896" cy="306" r="30"/>
      <circle cx="858" cy="176" r="20"/>
      <circle cx="936" cy="126" r="12"/>
    </g>

    <!-- cagoule et épaules -->
    <path fill="#06283E" d="M512 130 C720 130 850 270 850 470 C850 640 770 780 670 840 C780 870 920 900 960 1024 H64 C104 900 244 870 354 840 C254 780 174 640 174 470 C174 270 304 130 512 130 Z"/>

    <!-- visage, bleui par l'eau -->
    <ellipse cx="512" cy="520" rx="245" ry="285" fill="url(#face)"/>

    <!-- sangle du masque -->
    <rect x="160" y="384" width="704" height="84" rx="10" fill="#0F4464"/>

    <!-- flexible du détendeur -->
    <path fill="none" stroke="#0F4464" stroke-width="38" stroke-linecap="round" d="M610 706 C720 716 770 830 800 1040"/>

    <!-- détendeur -->
    <rect x="392" y="622" width="240" height="160" rx="72" fill="#06283E"/>
    <circle cx="512" cy="702" r="52" fill="#E8EAEB"/>
    <g fill="none" stroke="#06283E" stroke-width="12" stroke-linecap="round">
      <path d="M484 684 H540"/>
      <path d="M476 702 H548"/>
      <path d="M484 720 H540"/>
    </g>

    <!-- monture du masque -->
    <path fill="#06283E" d="M246 350 Q246 296 306 296 H718 Q778 296 778 350 V470 Q778 564 680 564 H626 Q574 564 550 516 Q534 486 512 486 Q490 486 474 516 Q450 564 398 564 H344 Q246 564 246 470 Z"/>

    <!-- verres rouges -->
    <g id="lens-left">
      <use xlink:href="#lens-shape" href="#lens-shape" fill="url(#lens)"/>
      <g clip-path="url(#lens-clip)" fill="#FFFFFF" fill-opacity=".38">
        <path d="M330 310 H392 L306 520 H244 Z"/>
        <path d="M416 310 H444 L358 520 H330 Z"/>
      </g>
    </g>
    <g transform="translate(1024 0) scale(-1 1)">
      <use xlink:href="#lens-shape" href="#lens-shape" fill="url(#lens)"/>
    </g>
  </g>
</svg>
